name: linux-rpm-appimage

# 把某个 release 里的 Linux .deb 转成 RPM + AppImage，并（可选）上传回同一个 release。
# 上游只发 deb，这个 workflow 让每个版本都能顺手带上 Fedora / openSUSE 用的包。

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "包含 linux .deb 的 release tag，例如 v1.13.2"
        required: true
        type: string
      upload:
        description: "构建完成后上传到该 release"
        required: false
        default: true
        type: boolean
      deb_repo:
        description: "从哪个仓库的 release 取 .deb（fork 里通常没有 deb，默认取上游）"
        required: false
        default: June6699/dart_simple_live
        type: string

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm binutils tar zstd curl file

      - name: Fetch .deb from release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          SRC: ${{ inputs.deb_repo }}
        run: |
          mkdir -p build/in
          # 优先从指定仓库取 deb（fork 的 release 通常没有 deb），失败再回退到本仓库
          if ! gh release download "$TAG" --pattern "*-linux.deb" --dir build/in --repo "$SRC"; then
            echo "::warning::$SRC 的 $TAG 没有 .deb，改从本仓库下载"
            gh release download "$TAG" --pattern "*-linux.deb" --dir build/in
          fi
          ls -lh build/in

      - name: Build RPM and AppImage
        run: |
          chmod +x packaging/linux/build-linux-packages.sh
          packaging/linux/build-linux-packages.sh --deb build/in/*-linux.deb --outdir dist

      - name: Show results
        run: ls -lh dist && (cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS)

      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            dist/*.rpm
            dist/*.AppImage
            dist/SHA256SUMS

      - name: Upload to release
        if: ${{ inputs.upload }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          # 本仓库还没有该 release 时先建一个，再上传（--clobber 覆盖同名资产）
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "Simple Live $TAG"
          gh release upload "$TAG" dist/*.rpm dist/*.AppImage dist/SHA256SUMS --clobber
